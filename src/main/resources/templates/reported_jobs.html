<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <div th:replace="~{fragments/header :: header}"></div>
    <script th:src="@{/assets/vendors/tinymce/tinymce.min.js}"></script>
    <script th:src="@{/assets/vendors/tinymce/plugins/code/plugin.min.js}"></script>
    <script>
        tinymce.init({ selector: '#default' });
        tinymce.init({ selector: '#required_skill' });
        tinymce.init({ selector: '#dark', toolbar: 'undo redo styleselect bold italic alignleft aligncenter alignright bullist numlist outdent indent code', plugins: 'code' });
    </script>
    <link rel="stylesheet" th:href="@{/assets/vendors/simple-datatables/style.css}">
</head>
<body>
<div id="app">
    <div id="sidebar" class="active">
        <div class="sidebar-wrapper active">
            <div class="sidebar-header">
                <div class="d-flex justify-content-between">
                    <div class="logo">
                        <a href="index.html"><img src="assets/images/logo/logo.png" alt="Logo" srcset=""></a>
                    </div>
                    <div class="toggler">
                        <a href="#" class="sidebar-hide d-xl-none d-block"><i class="bi bi-x bi-middle"></i></a>
                    </div>
                </div>
            </div>
            <div th:replace="~{fragments/navigation :: navigation}"></div>
            <button class="sidebar-toggler btn x"><i data-feather="x"></i></button>
        </div>
    </div>
    <div id="main" class='layout-navbar'>
        <div th:replace="~{fragments/profile_header :: profile-header}"></div>
        <div id="main-content">
            <div class="page-heading">
                <div class="page-title">
                    <div class="row">
                        <div class="col-12 col-md-6 order-md-1 order-last"></div>
                        <div class="col-12 col-md-6 order-md-2 order-first">
                            <nav aria-label="breadcrumb" class="breadcrumb-header float-start float-lg-end">
                                <ol class="breadcrumb">
                                    <li class="breadcrumb-item"><a th:href="@{/home}">Dashboard</a></li>
                                    <li class="breadcrumb-item active" aria-current="page">Find Work / Report Job List</li>
                                </ol>
                            </nav>
                        </div>
                    </div>
                </div>
                <section class="section">
                    <div class="card">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <span>🚨 Reported Jobs (Freelancer View)</span>
                            <span class="badge bg-danger">
                High Risk Jobs
            </span>
                        </div>

                        <div class="card-body">

                            <!-- Info Alert -->
                            <div class="alert alert-light-danger mb-4">
                                <i class="bi bi-shield-exclamation me-1"></i>
                                The following jobs have been reported by freelancers.
                                Please review the report details carefully before applying or continuing work.
                            </div>

                            <div class="row g-4">

                                <div class="col-md-6 col-lg-4"
                                     th:each="report : ${jobReports}">

                                    <div class="card h-100 shadow-sm border border-danger">

                                        <!-- Report Reason -->
                                        <div class="card-header bg-light-danger fw-bold text-danger py-2">
                                            <i class="bi bi-flag-fill"></i>
                                            <span th:text="${report.reportReason}"></span>
                                        </div>

                                        <div class="card-body d-flex flex-column">

                                            <!-- Job Title -->
                                            <h5 class="fw-bold mb-1"
                                                th:text="${report.getJob().title}">
                                            </h5>

                                            <!-- Category -->
                                            <p class="text-muted small mb-2">
                                                <i class="bi bi-tag"></i>
                                                <span th:text="${report.getJob().getCategory().getCategoryName()}"></span>
                                            </p>

                                            <!-- Report Description -->
                                            <div class="mb-3 small">
                                                <strong>Report Details:</strong>
                                                <p class="text-muted mb-0"
                                                   th:utext="${#strings.length(report.description) > 120 ?
                                      #strings.substring(report.description, 0, 120) + '...' :
                                      report.description}">
                                                </p>
                                            </div>

                                            <!-- Meta Info -->
                                            <div class="d-flex justify-content-between align-items-center small mb-3">
                                            <span>
                                                <i class="bi bi-calendar-event"></i>
                                                <span th:text="${#temporals.format(report.reportedAt,'yyyy-MM-dd')}"></span>
                                            </span>
                                            <span class="badge bg-danger">Reported</span>
                                            </div>

                                            <!-- Actions -->
                                            <div class="mt-auto d-flex justify-content-between align-items-center">
                                                <small class="text-muted">
                                                    Type: <span th:text="${report.getJob().jobType}"></span>
                                                </small>

                                                <a th:target="_blank"
                                                   class="btn btn-sm btn-outline-danger"
                                                   th:href="@{('/jobs/job_detail/' + ${@aesUtil.encryptId(report.getJob().id)})}">
                                                    <i class="bi bi-eye"></i> View Job
                                                </a>
                                            </div>

                                        </div>
                                    </div>

                                </div>

                            </div>

                        </div>
                    </div>
                </section>

                <div class="modal fade" id="jobViewModal" tabindex="-1" aria-hidden="true">
                    <div class="modal-dialog modal-lg">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title">Job Details</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body rounded bg-white" id="viewModalContent">
                                <!-- Form content will be loaded here -->

                            </div>
                        </div>
                    </div>
                </div>
                <!-- Delete Confirmation Modal -->
                <div class="modal fade" id="statusModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
                    <div class="modal-dialog">

                    </div>
                </div>
            </div>
            <footer>
                <div class="footer clearfix mb-0 text-muted">
                    <div th:replace="~{fragments/footer :: footer}"></div>
                    <script th:src="@{/assets/vendors/simple-datatables/simple-datatables.js}"></script>
                    <script>
                        // Simple Datatable
                        let table1 = document.querySelector('#table1');
                        let dataTable = new simpleDatatables.DataTable(table1);

                    </script>

                </div>
            </footer>
        </div>
        <!-- Toast Container (GLOBAL) -->
        <div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3"></div>
    </div>
</div>
</body>
</html>
