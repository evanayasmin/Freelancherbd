<!-- fragments/user_detail.html -->
<div th:fragment="profileDetail">
            <div class="row" th:object="${userDetail}">
                <div class="col-md-3 border-right">
                    <div class="d-flex flex-column align-items-center text-center p-3 py-5">
                        <img class="rounded-circle"
                             style="width:150px; height:170px; border-radius:8px;"
                             th:src="${userDetail.userProfile != null && userDetail.userProfile.profilePicture != null
              ? '/'+userDetail.userProfile.profilePicture
              : '/images/default.png'}" />
                        <span class="font-weight-bold" th:text="${userDetail.fullname}"></span><span class="text-black-50" th:text="${userDetail.email}"></span>
                    </div>
                </div>
                <div class="col-md-9 border-right">
                       <div class="row mt-2">
                           <h6 class="text-right">Personal Details</h6>
                           <div class="col-md-6"><label class="labels"><strong>User Name:</strong></label>&nbsp;<span th:text="${userDetail.username}"></span></div>
                           <div class="col-md-6"><label class="labels"><strong>Phone:</strong></label>&nbsp;<span th:text="${userDetail.phone}"></span></div>
                           <div class="col-md-6"><label class="labels"><strong>Gender:</strong></label>&nbsp;<span th:text="${userDetail.userProfile !=null && userDetail.userProfile.gender !=null ? userDetail.userProfile.gender : 'N/A'}"></span></div>
                           <div class="col-md-6"><label class="labels"><strong>NID:</strong></label>&nbsp;<span th:text="${userDetail.nid}"></span></div>
                           <div class="col-md-6"><label class="labels"><strong>Country:</strong></label>&nbsp;<span th:text="${userDetail.userProfile !=null && userDetail.userProfile.country !=null ? userDetail.userProfile.country :'N/A'}"></span></div>
                           <div class="col-md-6"><label class="labels"><strong>City:</strong></label>&nbsp;<span th:text="${userDetail.userProfile !=null && userDetail.userProfile.city !=null ? userDetail.userProfile.city : 'N/A'}"></span></div>
                           <div class="col-md-6"><label class="labels"><strong>Github Url:</strong></label>&nbsp;<span th:text="${userDetail.userProfile !=null && userDetail.userProfile.city !=null ? userDetail.userProfile.githubUrl : 'N/A'}"></span></div>
                           <div class="col-md-6"><label class="labels"><strong>Linkedin Url:</strong></label>&nbsp;<span th:text="${userDetail.userProfile !=null && userDetail.userProfile.linkedinUrl !=null ? userDetail.userProfile.linkedinUrl : 'N/A'}"></span></div>
                           <div class="col-md-6"><label class="labels"><strong>Skills:</strong> </label>&nbsp;<span th:text="${userDetail.userProfile !=null && userDetail.userProfile.skills !=null ? userDetail.userProfile.skills : 'N/A'}"></span></div>
                            <div class="col-md-6">
                            <form id="statusUpdateForm">
                               <label class="labels"><strong>Status:</strong></label>&nbsp;
                               <input type="hidden" id="encId" name="encId"  th:value="${@aesUtil.encryptId(userDetail.id)}" />
                               <label class="form-label">User Status</label>
                               <select class="form-select" name="status" id="statusSelect">
                                   <option th:each="st : ${statuses}"
                                           th:value="${st}"
                                           th:text="${st}"
                                           th:selected="${st == userDetail.status}">
                                   </option>
                               </select>
                                <button type="submit" class="btn btn-primary mt-2">Update</button>
                           </form>
                                <div id="statusMessage" class="mt-2 text-success" style="display:none;"></div>
                       </div>
                           <div class="col-md-6"><label class="labels"><strong>Created At:</strong></label>&nbsp;<span th:text="${userDetail.createdAt}"></span></div>
                       </div>
                        <div class="row mt-3">
                            <h6 class="text-right">Company Details</h6>
                            <div class="col-md-12"><label class="labels"><strong>Company Name:</strong></label>&nbsp;<span th:text="${userDetail.userProfile !=null && userDetail.userProfile.companyName !=null ? userDetail.userProfile.companyName : 'N/A'}"></span></div>
                            <div class="col-md-12"><label class="labels"><strong>Company Phone:</strong></label>&nbsp;<span th:text="${userDetail.userProfile !=null && userDetail.userProfile.companyPhone !=null ? userDetail.userProfile.companyPhone : 'N/A'}"></span></div>
                            <div class="col-md-12"><label class="labels"><strong>Company Email:</strong></label>&nbsp;<span th:text="${userDetail.userProfile !=null && userDetail.userProfile.companyEmail !=null ? userDetail.userProfile.companyEmail : 'N/A'}"></span></div>
                            <div class="col-md-12"><label class="labels"><strong>Website:</strong></label>&nbsp;<span th:text="${userDetail.userProfile !=null && userDetail.userProfile.companyUrl !=null ? userDetail.userProfile.companyUrl : 'N/A'}"></span></div>
                            <div class="col-md-12"><label class="labels"><strong>Address: </strong></label>&nbsp;<span th:text="${userDetail.userProfile !=null && userDetail.userProfile.companyAddress !=null ? userDetail.userProfile.companyAddress : 'N/A'}"></span></div>
                            <div class="col-md-12"><label class="labels"><strong>Business:</strong></label>&nbsp;<span th:text="${userDetail.userProfile !=null && userDetail.userProfile.companyBusiness !=null ? userDetail.userProfile.companyBusiness : 'N/A'}"></span></div>
                        </div>
                </div>
            </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-light-secondary"
                data-bs-dismiss="modal">
            <i class="bx bx-x d-block d-sm-none"></i>
            <span class="d-none d-sm-block">Close</span>
        </button>
    </div>
</div>
