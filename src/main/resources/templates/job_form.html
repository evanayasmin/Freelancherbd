<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <!-- Header Fragment -->
    <div th:replace="~{fragments/header :: header}"></div>

    <!-- TinyMCE -->
    <script th:src="@{/assets/vendors/tinymce/tinymce.min.js}"></script>
    <script>
        tinymce.init({
            selector: '.tinymce-basic',
            height: 280,
            menubar: false,
            plugins: 'lists link code',
            toolbar: 'undo redo | bold italic | bullist numlist | link | code'
        });
    </script>
</head>
<body>
<div id="app">

    <!-- Sidebar -->
    <div id="sidebar" class="active">
        <div class="sidebar-wrapper active">
            <div class="sidebar-header">
                <div class="d-flex justify-content-between align-items-center">
                    <a th:href="@{/home}">
                        <img th:src="@{/assets/images/logo/logo.png}" alt="Logo" height="35">
                    </a>
                    <a href="#" class="sidebar-hide d-xl-none"><i class="bi bi-x"></i></a>
                </div>
            </div>
            <div th:replace="~{fragments/navigation :: navigation}"></div>
        </div>
    </div>

    <!-- Main Content -->
    <div id="main" class="layout-navbar">

        <div th:replace="~{fragments/profile_header :: profile-header}"></div>

        <div id="main-content">
            <div class="page-heading">
                <nav aria-label="breadcrumb" class="breadcrumb-header float-end">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a th:href="@{/home}">Dashboard</a></li>
                        <li class="breadcrumb-item active">Create Job</li>
                    </ol>
                </nav>
            </div>

            <section class="section">
                <div class="row justify-content-center">
                    <div class="col-lg-12">
                        <div class="card">
                            <div class="card-header">
                                <h4 class="card-title">Create New Job</h4>
                            </div>
                            <div class="card-body">

                                <!-- Success Message -->
                                <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

                                <form th:object="${job}" th:action="@{/employer/job/submit_job}" method="post" class="form">
                                    <div class="row g-3">

                                        <div class="col-md-6">
                                            <label class="form-label">Job Title</label>
                                            <input type="text" class="form-control" th:field="*{title}" required>
                                        </div>

                                        <div class="col-md-6">
                                            <label class="form-label">Company Name</label>
                                            <input type="text" class="form-control" th:field="*{company}" required>
                                        </div>

                                        <div class="col-12">
                                            <label class="form-label">Job Description</label>
                                            <textarea class="form-control tinymce-basic" th:field="*{description}"></textarea>
                                        </div>

                                        <div class="col-md-6">
                                            <label class="form-label">Job Category</label>
                                            <select class="form-select" th:field="*{category}" required>
                                                <option value="">-- Select Category --</option>
                                                <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.categoryName}"></option>
                                            </select>
                                        </div>

                                        <div class="col-md-6">
                                            <label class="form-label">Job Type</label>
                                            <select class="form-select" th:field="*{jobType}" required>
                                                <option th:each="jt : ${jobTypes}" th:value="${jt.name()}" th:text="${jt.name()}"></option>
                                            </select>
                                        </div>

                                        <div class="col-12">
                                            <label class="form-label">Required Skills</label>
                                            <textarea class="form-control tinymce-basic" th:field="*{requiredSkill}"></textarea>
                                        </div>

                                        <div class="col-md-4">
                                            <label class="form-label">Required Level</label>
                                            <select class="form-select" th:field="*{requiredLevel}">
                                                <option value="">-- Select Level --</option>
                                                <option value="SSC">S.S.C</option>
                                                <option value="HSC">H.S.C</option>
                                                <option value="BACHELOR">Bachelor</option>
                                                <option value="MASTER">Master</option>
                                                <option value="PHD">PhD</option>
                                            </select>
                                        </div>

                                        <div class="col-md-4">
                                            <label class="form-label">Vacancy</label>
                                            <input type="number" class="form-control" th:field="*{vacancy}" min="1">
                                        </div>

                                        <div class="col-md-4">
                                            <label class="form-label">Age Limit</label>
                                            <input type="text" class="form-control" th:field="*{ageLimit}" placeholder="e.g. 25–40">
                                        </div>

                                        <div class="col-md-6">
                                            <label class="form-label">Required Experience</label>
                                            <input type="text" class="form-control" th:field="*{experience}" placeholder="e.g. 3+ years">
                                        </div>

                                        <div class="col-md-6">
                                            <label class="form-label">Payment Amount (BDT)</label>
                                            <input type="number" step="0.01" class="form-control" th:field="*{paymentAmount}" required>
                                        </div>

                                        <div class="col-md-6">
                                            <label class="form-label">Platform Fee (BDT)</label>
                                            <input type="number" step="0.01" class="form-control" th:field="*{platformFee}" readonly>
                                        </div>

                                        <div class="col-md-6">
                                            <label class="form-label">Application Deadline</label>
                                            <input type="datetime-local" class="form-control" th:field="*{deadline}" required>
                                        </div>

                                        <div class="col-12">
                                            <label class="form-label">Job Location</label>
                                            <input type="text" class="form-control" th:field="*{jobLocation}" required>
                                        </div>

                                        <div class="col-12">
                                            <label class="form-label">Special Instructions</label>
                                            <textarea class="form-control" rows="4" th:field="*{companyInstruction}"></textarea>
                                        </div>

                                        <div class="col-12 text-end">
                                            <button type="submit" class="btn btn-primary">Submit Job</button>
                                            <button type="reset" class="btn btn-light-secondary">Reset</button>
                                        </div>

                                    </div>
                                </form>

                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <footer class="footer mt-4">
                <div th:replace="~{fragments/footer :: footer}"></div>
            </footer>

        </div>
    </div>
</div>
</body>
</html>
