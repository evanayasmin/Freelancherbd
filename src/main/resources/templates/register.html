<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FreelanchingBD | Register</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" th:href="@{/assets/css/bootstrap.css}">
    <link rel="stylesheet" th:href="@{/assets/vendors/bootstrap-icons/bootstrap-icons.css}">
    <link rel="stylesheet" th:href="@{/assets/css/app.css}">
    <link rel="stylesheet" th:href="@{/assets/css/pages/auth.css}">

    <script th:src="@{/js/bootstrap.bundle.min.js}" defer></script>
</head>

<body>
<div id="auth">
    <div class="row h-100">

        <!-- LEFT: Registration Form -->
        <div class="col-lg-6 col-12 d-flex align-items-center">
            <div class="auth-form w-100 px-4 px-lg-5">

                <!-- Logo -->
                <div class="text-center mb-4">
                    <a th:href="@{/login}">
                        <img src="/images/logo-4.png" alt="FreelanchingBD" style="height:120px;">
                    </a>
                </div>

                <!-- Title -->
                <h2 class="fw-bold text-center mb-2">Create Your Account 🚀</h2>
                <p class="text-center text-muted mb-4">
                    Join FreelanchingBD and start your journey
                </p>

                <!-- Registration Form -->
                <form th:action="@{/register}" method="post">

                    <!-- Full Name -->
                    <div class="form-group position-relative has-icon-left mb-3">
                        <input type="text"
                               class="form-control form-control-lg"
                               placeholder="Full Name"
                               name="fullname"
                               required>
                        <div class="form-control-icon">
                            <i class="bi bi-person"></i>
                        </div>
                    </div>

                    <!-- Username -->
                    <div class="form-group position-relative has-icon-left mb-3">
                        <input type="text"
                               class="form-control form-control-lg"
                               placeholder="Username"
                               name="username"
                               required>
                        <div class="form-control-icon">
                            <i class="bi bi-person-badge"></i>
                        </div>
                    </div>

                    <!-- Email -->
                    <div class="form-group position-relative has-icon-left mb-3">
                        <input type="email"
                               class="form-control form-control-lg"
                               placeholder="Email Address"
                               name="email"
                               required>
                        <div class="form-control-icon">
                            <i class="bi bi-envelope"></i>
                        </div>
                    </div>

                    <!-- Mobile -->
                    <div class="form-group position-relative has-icon-left mb-3">
                        <input type="number"
                               class="form-control form-control-lg"
                               placeholder="Mobile Number"
                               name="phone"
                               required>
                        <div class="form-control-icon">
                            <i class="bi bi-phone"></i>
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="form-group position-relative has-icon-left mb-3">
                        <input type="password"
                               class="form-control form-control-lg"
                               placeholder="Password"
                               name="password"
                               required>
                        <div class="form-control-icon">
                            <i class="bi bi-lock"></i>
                        </div>
                    </div>

                    <!-- NID -->
                    <div class="form-group position-relative has-icon-left mb-3">
                        <input type="number"
                               class="form-control form-control-lg"
                               placeholder="National ID (NID)"
                               name="nid"
                               required>
                        <div class="form-control-icon">
                            <i class="bi bi-credit-card-2-front"></i>
                        </div>
                    </div>

                    <!-- Role -->
                    <div class="form-group position-relative has-icon-left mb-4">
                        <select class="form-control form-control-lg"
                                name="role"
                                required>
                            <option value="" disabled>Select User Type</option>
                            <option value="ROLE_FREELANCER" selected>Freelancer</option>
                            <option value="ROLE_EMPLOYER">Employer</option>
                        </select>
                        <div class="form-control-icon">
                            <i class="bi bi-people"></i>
                        </div>
                    </div>

                    <!-- Submit -->
                    <button type="submit"
                            class="btn btn-primary btn-lg btn-block shadow-sm">
                        Create Account
                    </button>
                </form>

                <!-- Login Redirect -->
                <div class="text-center mt-4">
                    <p class="text-muted">
                        Already have an account?
                        <a th:href="@{/login}" class="fw-bold text-primary">
                            Sign In
                        </a>
                    </p>
                </div>

            </div>
        </div>

        <!-- RIGHT: Illustration -->
        <div class="col-lg-6 d-none d-lg-flex align-items-center justify-content-center bg-light">
            <div class="text-center px-5">
                <img src="/images/happy_mom_working.png"
                     alt="Freelancing Illustration"
                     class="img-fluid"
                     style="max-height:520px;">
                <h4 class="mt-4 fw-bold text-dark">
                    Hire or Get Hired with Confidence
                </h4>
                <p class="text-muted">
                    Thousands of freelancers and employers trust FreelanchingBD.
                </p>
            </div>
        </div>

    </div>
</div>
</body>
</html>
