<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <div th:replace="~{fragments/header :: header}"></div>
</head>
<body th:data-username="${#authentication.name}">
<div id="app">
    <div id="sidebar" class="active">
        <div class="sidebar-wrapper active">
            <div class="sidebar-header">
                <div class="d-flex justify-content-between">
                    <div class="logo">
                        <a href="index.html"><img src="assets/images/logo/logo.png" alt="Logo" srcset=""></a>
                    </div>
                    <div class="toggler">
                        <a href="#" class="sidebar-hide d-xl-none d-block"><i class="bi bi-x bi-middle"></i></a>
                    </div>
                </div>
            </div>
            <div th:replace="~{fragments/navigation :: navigation}"></div>
            <button class="sidebar-toggler btn x"><i data-feather="x"></i></button>
        </div>
    </div>
    <div id="main" class='layout-navbar'>
        <div th:replace="~{fragments/profile_header :: profile-header}"></div>
        <div id="main-content">
            <div class="page-heading">
                <div class="page-title">
                    <div class="row">
                        <div class="col-12 col-md-6 order-md-1 order-last"></div>
                        <div class="col-12 col-md-6 order-md-2 order-first">
                            <nav aria-label="breadcrumb" class="breadcrumb-header float-start float-lg-end">
                                <ol class="breadcrumb">
                                    <li class="breadcrumb-item"><a th:href="@{/home}">Dashboard</a></li>
                                    <li class="breadcrumb-item active" aria-current="page">Chat / Chat With Users</li>
                                </ol>
                            </nav>
                        </div>
                    </div>
                </div>
                <section id="basic-vertical-layouts">
                    <div class="row match-height">
                        <div class="col-md-12 col-12">
                            <div class="card bg-light-secondary">
                                <div class="card-header bg-light-secondary">Chat With Users <i class="bi-chat-dots-fill text-primary"></i></div>
                                <div class="card-content">
                                    <div class="row" style="height: 80vh;">

                                        <!-- LEFT SIDEBAR: ONLINE USERS -->
                                        <div class="col-md-3 col-sm-4">

                                            <div class="card h-100">
                                                <div class="card-header fw-bold bg-light-primary">Online Users <i class="bi-people-fill text-success"></i> </div>

                                                <ul class="list-group list-group-flush"
                                                    id="onlineUsersList">

                                                    <!-- JS will inject users here -->
                                                    <!-- Example:
                                                    <li class="list-group-item chatUser active"
                                                        data-username="john">
                                                        <span class="online-dot"></span>
                                                        john
                                                    </li>
                                                    -->
                                                </ul>
                                            </div>
                                        </div>

                                        <!-- RIGHT PANEL: CHAT AREA -->
                                        <div class="col-md-9 col-sm-8">

                                            <div class="card h-100 d-flex flex-column">

                                                <!-- Chat header -->
                                                <div class="card-header bg-light-primary text-black">
                                                    Chat with:
                                                    <b id="chatWith">Select a user</b>
                                                </div>

                                                <!-- Messages -->
                                                <div class="card-body chat-messages"
                                                     id="chatMessages">
                                                    <!-- Messages appear here -->
                                                </div>

                                                <!-- Input -->
                                                <div class="card-footer chat-input">
                                                    <input type="text"
                                                           id="chatInput"
                                                           placeholder="Type your message..."
                                                           disabled>

                                                    <button id="chatSendBtn"
                                                            class="btn btn-primary"
                                                            disabled>
                                                        Send
                                                    </button>
                                                </div>

                                            </div>

                                        </div>

                                    </div>

                                </div>
                            </div>
                        </div>
                    </div>
                </section>
                <!-- Toast Container (GLOBAL) -->
                <div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3"></div>
            </div>
            <footer>
                <div class="footer clearfix mb-0 text-muted">
                    <div th:replace="~{fragments/footer :: footer}"></div>
                </div>
            </footer>
        </div>
    </div>
</div>
</body>
</html>
