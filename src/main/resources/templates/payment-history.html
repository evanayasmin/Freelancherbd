<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <div th:replace="~{fragments/header :: header}"></div>
    <link rel="stylesheet" th:href="@{/assets/vendors/simple-datatables/style.css}">
</head>
<body>
<div id="app">
    <!-- Sidebar -->
    <div id="sidebar" class="active">
        <div class="sidebar-wrapper active">
            <div class="sidebar-header">
                <div class="d-flex justify-content-between">
                    <div class="logo">
                        <a href="#"><img src="assets/images/logo/logo.png" alt="Logo"></a>
                    </div>
                    <div class="toggler">
                        <a href="#" class="sidebar-hide d-xl-none d-block">
                            <i class="bi bi-x bi-middle"></i>
                        </a>
                    </div>
                </div>
            </div>

            <div th:replace="~{fragments/navigation :: navigation}"></div>

            <button class="sidebar-toggler btn x">
                <i data-feather="x"></i>
            </button>
        </div>
    </div>

    <!-- Main -->
    <div id="main" class="layout-navbar">

        <div th:replace="~{fragments/profile_header :: profile-header}"></div>

        <div id="main-content">
            <div class="page-heading">

                <!-- Breadcrumb -->
                <div class="page-title">
                    <div class="row">
                        <div class="col-12 col-md-6"></div>
                        <div class="col-12 col-md-6">
                            <nav class="breadcrumb-header float-start float-lg-end">
                                <ol class="breadcrumb">
                                    <li class="breadcrumb-item">
                                        <a th:href="@{/home}">Dashboard</a>
                                    </li>
                                    <li class="breadcrumb-item">Payments</li>
                                    <li class="breadcrumb-item active">Payment History</li>
                                </ol>
                            </nav>
                        </div>
                    </div>
                </div>

                <!-- ===================== SECTION ===================== -->
                <section class="section">

                    <!-- Header Stats -->
                    <div class="d-flex flex-column flex-lg-row justify-content-between align-items-lg-center gap-3 mb-4">

                        <div class="d-flex align-items-start gap-3">
                            <div class="avatar bg-light-success">
                                <i class="bi bi-receipt text-success"></i>
                            </div>
                            <div>
                                <h5 class="mb-1 fw-bold">Payment History</h5>
                                <div class="text-muted small">
                                    All completed and refunded payments
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- Statistics Panel -->
                    <div class="row g-3 mb-4">
                        <div class="col-xl-3 col-md-6">
                            <div class="card shadow-sm border-0">
                                <div class="card-body">
                                    <h6 class="text-muted mb-1">Total Transactions</h6>
                                    # <h5 class="fw-bold text-primary" th:text="${totalPayments}"></h5>
                                </div>
                            </div>
                        </div>

                        <div class="col-xl-3 col-md-6">
                            <div class="card shadow-sm border-0">
                                <div class="card-body">
                                    <h6 class="text-muted mb-1">Total Paid</h6>
                                    ৳ <h5 class="fw-bold text-info" th:text="${totalCompletedAmount}"></h5>
                                </div>
                            </div>
                        </div>

                        <div class="col-xl-3 col-md-6">
                            <div class="card shadow-sm border-0">
                                <div class="card-body">
                                    <h6 class="text-muted mb-1">Total Refund</h6>
                                    ৳ <h5 class="fw-bold text-warning" th:text="${totalRefundAmount}"></h5>
                                </div>
                            </div>
                        </div>

                        <div class="col-xl-3 col-md-6">
                            <div class="card shadow-sm border-0">
                                <div class="card-body">
                                    <h6 class="text-muted mb-1">Processing</h6>
                                    ৳ <h5 class="fw-bold text-success" th:text="${totalProcessAmount}"></h5>
                                </div>
                            </div>
                        </div>

                    </div>

                    <!-- Payment History Table -->
                    <div class="card">
                        <div class="card-header fw-bold">Payment Records</div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-hover align-middle" id="table1">
                                    <thead class="table-light">
                                    <tr>
                                        <th>Transaction ID</th>
                                        <th>Task</th>
                                        <th>Freelancer</th>
                                        <th>Amount</th>
                                        <th>Payment Type</th>
                                        <th>Status</th>
                                        <th>Paid At</th>
                                        <th class="text-center">Action</th>
                                    </tr>
                                    </thead>

                                    <tbody>
                                    <tr th:each="pay : ${paymentHistory}">

                                        <td class="fw-semibold"
                                            th:text="${pay.transactionId}">
                                        </td>

                                        <td th:text="${pay.job.title}"></td>

                                        <td>
                                            <div class="d-flex align-items-center gap-2">
                                                <div class="avatar bg-primary text-white rounded-circle">
                                                    <span th:text="${#strings.substring(pay.freelancerId.fullname,0,1)}"></span>
                                                </div>
                                                <span th:text="${pay.freelancerId.fullname}"></span>
                                            </div>
                                        </td>

                                        <td class="fw-bold text-success">
                                            ৳ <span th:text="${pay.amount}"></span>
                                        </td>

                                        <td>
                                            <span class="badge bg-light-secondary"
                                                  th:text="${pay.paymentType}">
                                            </span>
                                        </td>

                                        <td>
                                           <span class="badge bg-success"
                                                 th:if="${pay.status.name() == 'COMPLETED'}">
                                                    Completed
                                                </span>

                                            <span class="badge bg-warning" th:if="${pay.status.name() == 'PROCESSING'}">
                                                    Processing
                                                </span>

                                            <span class="badge bg-danger"
                                                  th:if="${pay.status.name() == 'FAILED'}">
                                                Failed
                                            </span>

                                        </td>

                                        <td class="text-muted">
                                            <i class="bi bi-clock me-1"></i>
                                            <span th:text="${#temporals.format(pay.createdAt,'dd MMM yyyy')}"></span>
                                        </td>

                                        <td class="text-center">
                                            <a class="btn btn-sm btn-outline-primary" target="_blank"
                                               th:href="@{/employer/payments/invoice(encId=${@aesUtil.encryptId(pay.id)})}">
                                                <i class="bi bi-file-earmark-pdf"></i>
                                                Invoice
                                            </a>
                                        </td>

                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                </section>
                <!-- ===================== SECTION END ===================== -->

            </div>

            <!-- Footer -->
            <footer>
                <div class="footer clearfix mb-0 text-muted">
                    <div th:replace="~{fragments/footer :: footer}"></div>

                    <script th:src="@{/assets/vendors/simple-datatables/simple-datatables.js}"></script>
                    <script>
                        let table1 = document.querySelector('#table1');
                        let dataTable = new simpleDatatables.DataTable(table1);
                    </script>
                </div>
            </footer>

        </div>
    </div>
</div>
</body>
</html>
