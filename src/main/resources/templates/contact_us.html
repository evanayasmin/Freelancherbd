<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <div th:replace="~{fragments/header :: header}"></div>
</head>
<body>
<div id="app">
    <!-- Sidebar -->
    <div id="sidebar" class="active">
        <div class="sidebar-wrapper active">
            <div class="sidebar-header">
                <div class="d-flex justify-content-between">
                    <div class="logo">
                        <a th:href="@{/home}">
                            <img src="assets/images/logo/logo.png" alt="Logo">
                        </a>
                    </div>
                    <div class="toggler">
                        <a href="#" class="sidebar-hide d-xl-none d-block">
                            <i class="bi bi-x bi-middle"></i>
                        </a>
                    </div>
                </div>
            </div>

            <div th:replace="~{fragments/navigation :: navigation}"></div>
            <button class="sidebar-toggler btn x">
                <i data-feather="x"></i>
            </button>
        </div>
    </div>

    <!-- Main -->
    <div id="main" class="layout-navbar">

        <!-- Top Profile Header -->
        <div th:replace="~{fragments/profile_header :: profile-header}"></div>

        <div id="main-content">
            <div class="page-heading">

                <!-- Page Title & Breadcrumb -->
                <div class="page-title">
                    <div class="row">
                        <div class="col-12 col-md-6 order-md-1 order-last">
                            <h3>Contact Us</h3>
                        </div>
                        <div class="col-12 col-md-6 order-md-2 order-first">
                            <nav aria-label="breadcrumb"
                                 class="breadcrumb-header float-start float-lg-end">
                                <ol class="breadcrumb">
                                    <li class="breadcrumb-item">
                                        <a th:href="@{/home}">Dashboard</a>
                                    </li>
                                    <li class="breadcrumb-item active" aria-current="page">
                                        Contact Us
                                    </li>
                                </ol>
                            </nav>
                        </div>
                    </div>
                </div>

                <!-- Contact Section -->
                <section class="section">
                    <div class="row justify-content-center">
                        <div class="col-12 col-lg-8">

                            <div class="card">
                                <div class="card-header">
                                    <h4>Send a Message to Admin</h4>
                                </div>

                                <div class="card-body">

                                    <p class="text-muted mb-4">
                                        Have questions, issues, or feedback?
                                        Reach out to the <strong>FreelancingBd</strong> admin team.
                                    </p>

                                    <!-- Success Message -->
                                    <div th:if="${successMessage}"
                                         class="alert alert-success">
                                        <span th:text="${successMessage}"></span>
                                    </div>

                                    <!-- Error Message -->
                                    <div th:if="${errorMessage}"
                                         class="alert alert-danger">
                                        <span th:text="${errorMessage}"></span>
                                    </div>

                                    <!-- Contact Form -->
                                    <form th:action="@{/user/support/contact}" method="post">

                                        <div class="row">
                                            <div class="col-md-6 mb-3">
                                                <label class="form-label">Full Name</label>
                                                <input type="text"
                                                       name="name"
                                                       class="form-control"
                                                       placeholder="Your full name"
                                                       required>
                                            </div>

                                            <div class="col-md-6 mb-3">
                                                <label class="form-label">Email Address</label>
                                                <input type="email"
                                                       name="email"
                                                       class="form-control"
                                                       placeholder="your@email.com"
                                                       required>
                                            </div>
                                        </div>

                                        <div class="mb-3">
                                            <label class="form-label">Subject</label>
                                            <input type="text"
                                                   name="subject"
                                                   class="form-control"
                                                   placeholder="Message subject"
                                                   required>
                                        </div>

                                        <div class="mb-3">
                                            <label class="form-label">Message</label>
                                            <textarea name="message"
                                                      rows="5"
                                                      class="form-control"
                                                      placeholder="Write your message here..."
                                                      required></textarea>
                                        </div>

                                        <div class="d-flex justify-content-end">
                                            <button type="submit"
                                                    class="btn btn-primary">
                                                <i class="bi bi-send-fill me-1"></i>
                                                Send Message
                                            </button>
                                        </div>

                                    </form>

                                </div>
                            </div>

                        </div>
                    </div>
                </section>

                <!-- Toast Container -->
                <div id="toastContainer"
                     class="toast-container position-fixed bottom-0 end-0 p-3"></div>

            </div>

            <!-- Footer -->
            <footer>
                <div class="footer clearfix mb-0 text-muted">
                    <div th:replace="~{fragments/footer :: footer}"></div>
                </div>
            </footer>

        </div>
    </div>
</div>

</body>
</html>
