<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <div th:replace="~{fragments/header :: header}"></div>
    <script th:src="@{/assets/vendors/tinymce/tinymce.min.js}"></script>
    <script th:src="@{/assets/vendors/tinymce/plugins/code/plugin.min.js}"></script>
    <script>
        tinymce.init({ selector: '#default' });
        tinymce.init({ selector: '#required_skill' });
        tinymce.init({ selector: '#dark', toolbar: 'undo redo styleselect bold italic alignleft aligncenter alignright bullist numlist outdent indent code', plugins: 'code' });
    </script>
    <link rel="stylesheet" th:href="@{/assets/vendors/simple-datatables/style.css}">
</head>
<body>
<div id="app">
    <div id="sidebar" class="active">
        <div class="sidebar-wrapper active">
            <div class="sidebar-header">
                <div class="d-flex justify-content-between">
                    <div class="logo">
                        <a href="index.html"><img src="assets/images/logo/logo.png" alt="Logo" srcset=""></a>
                    </div>
                    <div class="toggler">
                        <a href="#" class="sidebar-hide d-xl-none d-block"><i class="bi bi-x bi-middle"></i></a>
                    </div>
                </div>
            </div>
            <div th:replace="~{fragments/navigation :: navigation}"></div>
            <button class="sidebar-toggler btn x"><i data-feather="x"></i></button>
        </div>
    </div>
    <div id="main" class='layout-navbar'>
        <div th:replace="~{fragments/profile_header :: profile-header}"></div>
        <div id="main-content">
            <div class="page-heading">
                <div class="page-title">
                    <div class="row">
                        <div class="col-12 col-md-6 order-md-1 order-last"></div>
                        <div class="col-12 col-md-6 order-md-2 order-first">
                            <nav aria-label="breadcrumb" class="breadcrumb-header float-start float-lg-end">
                                <ol class="breadcrumb">
                                    <li class="breadcrumb-item"><a th:href="@{/home}">Dashboard</a></li>
                                    <li class="breadcrumb-item active" aria-current="page">Find Work / Recommended Job List</li>
                                </ol>
                            </nav>
                        </div>
                    </div>
                </div>
                <section class="section">
                    <div class="card">
<!--                        <div class="card-header">Recommended Job List</div>-->
<!--                        <div class="card-body" id="freelancerCardBody"></div>-->
                        <div class="card-body">

                            <!-- Page Title -->
                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <h5 class="mb-0">
                                    <i class="bi bi-stars text-warning me-2"></i>
                                    Recommended Jobs for You
                                </h5>
                            </div>

                            <!-- Job Cards -->
                            <div class="row g-4">

                                <div class="col-12" th:each="job : ${jobs}">
                                    <div class="card job-card shadow-sm border-0">

                                        <div class="card-body">

                                            <!-- Title + Badge -->
                                            <div class="d-flex justify-content-between align-items-start mb-2">
                                                <h5 class="fw-bold mb-0" th:text="${job.title}"></h5>
                                                <span class="badge bg-light-primary">
                                                <i class="bi bi-briefcase me-1"></i>
                                                <span th:text="${job.jobType}"></span>
                                            </span>
                                            </div>

                                            <!-- Meta Info -->
                                            <div class="text-muted small mb-3">
                                                <i class="bi bi-folder me-1"></i>
                                                <span th:text="${job.category.categoryName}"></span>
                                                &nbsp;•&nbsp;
                                                <i class="bi bi-geo-alt me-1"></i>
                                                <span th:text="${job.jobLocation}"></span>
                                            </div>

                                            <!-- Skills -->
                                            <div class="mb-3">
                                                <span class="fw-semibold">Required Skills:</span>
                                                <p class="mb-0 text-muted">
                                                    <span th:text="${#strings.abbreviate(job.requiredSkill,120)}"></span>
                                                </p>
                                            </div>

                                            <!-- Job Highlights -->
                                            <div class="row text-center border rounded py-2 mb-3 bg-light">

                                                <div class="col-md-4">
                                                    <i class="bi bi-cash text-success"></i>
                                                    <div class="small text-muted">Budget</div>
                                                    <div class="fw-semibold" th:text="${job.paymentAmount}"></div>
                                                </div>

                                                <div class="col-md-4">
                                                    <i class="bi bi-calendar-event text-primary"></i>
                                                    <div class="small text-muted">Deadline</div>
                                                    <div class="fw-semibold"
                                                         th:text="${#temporals.format(job.deadline,'yyyy-MM-dd')}"></div>
                                                </div>

                                                <div class="col-md-4">
                                                    <i class="bi bi-people text-warning"></i>
                                                    <div class="small text-muted">Vacancy</div>
                                                    <div class="fw-semibold"
                                                         th:text="${job.vacancy != null ? job.vacancy : 'N/A'}"></div>
                                                </div>

                                            </div>

                                            <!-- Footer -->
                                            <div class="d-flex justify-content-between align-items-center">

                                                <div class="small text-muted">
                                                    <i class="bi bi-clock-history me-1"></i>
                                                    Posted on
                                                    <span th:text="${#temporals.format(job.createdAt,'yyyy-MM-dd')}"></span>
                                                </div>

                                                <a th:href="@{('/jobs/job_detail/' + ${@aesUtil.encryptId(job.id)})}"
                                                   th:target="_blank"
                                                   class="btn btn-sm btn-outline-primary">
                                                    <i class="bi bi-eye me-1"></i>
                                                    View Details
                                                </a>

                                            </div>

                                        </div>
                                    </div>
                                </div>

                            </div>
                        </div>

                    </div>
                </section>
                <div class="modal fade" id="jobViewModal" tabindex="-1" aria-hidden="true">
                    <div class="modal-dialog modal-lg">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title">Job Details</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body rounded bg-white" id="viewModalContent">
                                <!-- Form content will be loaded here -->

                            </div>
                        </div>
                    </div>
                </div>
                <!-- Delete Confirmation Modal -->
                <div class="modal fade" id="statusModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
                    <div class="modal-dialog">

                    </div>
                </div>
            </div>
            <footer>
                <div class="footer clearfix mb-0 text-muted">
                    <div th:replace="~{fragments/footer :: footer}"></div>
                    <script th:src="@{/assets/vendors/simple-datatables/simple-datatables.js}"></script>
                    <script>
                        // Simple Datatable
                        let table1 = document.querySelector('#table1');
                        let dataTable = new simpleDatatables.DataTable(table1);

                    </script>

                </div>
            </footer>
        </div>
        <!-- Toast Container (GLOBAL) -->
        <div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3"></div>
    </div>
</div>
</body>
</html>
