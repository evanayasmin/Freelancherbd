<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <div th:replace="~{fragments/header :: header}"></div>
    <link rel="stylesheet" th:href="@{/assets/vendors/simple-datatables/style.css}">
</head>

<body>
<div id="app">

    <!-- Sidebar -->
    <div id="sidebar" class="active">
        <div class="sidebar-wrapper active">
            <div class="sidebar-header">
                <div class="d-flex justify-content-between">
                    <div class="logo">
                        <a href="#"><img src="assets/images/logo/logo.png" alt="Logo"></a>
                    </div>
                    <div class="toggler">
                        <a href="#" class="sidebar-hide d-xl-none d-block">
                            <i class="bi bi-x bi-middle"></i>
                        </a>
                    </div>
                </div>
            </div>

            <div th:replace="~{fragments/navigation :: navigation}"></div>

            <button class="sidebar-toggler btn x">
                <i data-feather="x"></i>
            </button>
        </div>
    </div>

    <!-- Main -->
    <div id="main" class="layout-navbar">

        <div th:replace="~{fragments/profile_header :: profile-header}"></div>

        <div id="main-content">
            <div class="page-heading">

                <!-- Breadcrumb -->
                <div class="page-title">
                    <div class="row">
                        <div class="col-12 col-md-6"></div>
                        <div class="col-12 col-md-6">
                            <nav class="breadcrumb-header float-start float-lg-end">
                                <ol class="breadcrumb">
                                    <li class="breadcrumb-item">
                                        <a th:href="@{/home}">Dashboard</a>
                                    </li>
                                    <li class="breadcrumb-item">
                                        Payments
                                    </li>
                                    <li class="breadcrumb-item active">
                                        Pending Payments
                                    </li>
                                </ol>
                            </nav>
                        </div>
                    </div>
                </div>

                <!-- ===================== SECTION ===================== -->
                <section class="section">

                    <!-- Statistics Header -->
                    <div class="d-flex flex-column flex-lg-row justify-content-between align-items-lg-center gap-3 mb-4">

                        <div class="d-flex align-items-start gap-3">
                            <div class="avatar bg-light-warning">
                                <i class="bi bi-hourglass-split text-warning"></i>
                            </div>
                            <div>
                                <h5 class="mb-1 fw-bold">Pending Payments</h5>
                                <div class="text-muted small">
                                    Completed jobs awaiting payment confirmation.
                                </div>
                            </div>
                        </div>

                        <div class="d-flex gap-3 flex-wrap">
                            <div class="stat-box">
                                <div class="stat-value" th:text="${pendingCount}">0</div>
                                <div class="stat-label">Jobs</div>
                            </div>

                            <div class="stat-box">
                                <div class="stat-value text-warning">
                                    ৳ <span th:text="${pendingAmount}">0</span>
                                </div>
                                <div class="stat-label">Total Pending</div>
                            </div>
                        </div>
                    </div>

                    <!-- Payment Cards -->
                    <div class="card">
                        <div class="card-header fw-bold">
                            Pending Payment List
                        </div>

                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-hover align-middle" id="table1">
                                    <thead class="table-light">
                                    <tr>
                                        <th>Task</th>
                                        <th>Category</th>
                                        <th>Applicant</th>
                                        <th>Payment</th>
                                        <th>Status</th>
                                        <th>Submitted At</th>
                                        <th class="text-center">Action</th>
                                    </tr>
                                    </thead>

                                    <tbody>
                                    <tr th:each="jobp : ${jobPayments}">

                                        <!-- Job -->
                                        <td>
                                            <div class="fw-semibold" th:text="${jobp.getJob().getTitle()}"></div>
                                        </td>

                                        <!-- Category -->
                                        <td>
                                        <span class="badge bg-light-secondary"
                                              th:text="${jobp.job.category.categoryName}">
                                        </span>
                                        </td>

                                        <!-- Applicant -->
                                        <td>
                                            <div class="d-flex align-items-center gap-2">
                                                <div class="avatar bg-info text-white rounded-circle">
                                                    <span th:text="${#strings.substring(jobp.user.fullname,0,1)}"></span>
                                                </div>
                                                <span class="fw-medium" th:text="${jobp.user.fullname}"></span>
                                            </div>
                                        </td>

                                        <!-- Salary -->
                                        <td class="fw-bold text-success">
                                            ৳ <span th:text="${jobp.job.getPaymentAmount()}"></span>
                                        </td>

                                        <!-- Status -->
                                        <td>
                                            <span class="badge bg-primary text-white" th:if="${jobp.getTrafficType().name() == 'SUBMITTED'}">
                                                Submitted
                                            </span>
<!--                                            <span th:if="${jobp.applicationStatus.name() == 'VIEWED'}"-->
<!--                                                  class="badge bg-info">-->
<!--                                                VIEWED-->
<!--                                            </span>-->
                                        </td>

                                        <!-- Date -->
                                        <td class="text-muted">
                                            <i class="bi bi-clock me-1"></i>
                                            <span th:text="${#temporals.format(jobp.getUpdatedAt(),'dd MMM yyyy')}"></span>
                                        </td>

                                        <!-- Action -->
                                        <td class="text-center">
                                            <button type="button"
                                                    class="btn btn-sm btn-outline-primary"
                                                    data-bs-toggle="modal"
                                                    data-bs-target="#proposalViewModal"
                                                    th:data-url="@{/employer/jobs/proposal_details(encId=${@aesUtil.encryptId(jobp.id)})}">
                                                <i class="bi bi-eye"></i>
                                                Payment
                                            </button>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                </section>
                <!-- ===================== SECTION END ===================== -->

            </div>

            <!-- Job Detail Modal -->
            <div class="modal fade" id="jobViewModal" tabindex="-1">
                <div class="modal-dialog modal-lg">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title">Job Details</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body" id="viewModalContent"></div>
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <footer>
                <div class="footer clearfix mb-0 text-muted">
                    <div th:replace="~{fragments/footer :: footer}"></div>
                    <script th:src="@{/assets/vendors/simple-datatables/simple-datatables.js}"></script>
                    <script>
                        // Simple Datatable
                        let table1 = document.querySelector('#table1');
                        let dataTable = new simpleDatatables.DataTable(table1);

                    </script>

                </div>
            </footer>

        </div>

        <div id="toastContainer"
             class="toast-container position-fixed bottom-0 end-0 p-3"></div>
    </div>
</div>
</body>
</html>
