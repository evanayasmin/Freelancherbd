<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FreelanchingBD | Login</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" th:href="@{/assets/css/bootstrap.css}">
    <link rel="stylesheet" th:href="@{/assets/vendors/bootstrap-icons/bootstrap-icons.css}">
    <link rel="stylesheet" th:href="@{/assets/css/app.css}">
    <link rel="stylesheet" th:href="@{/assets/css/pages/auth.css}">

    <script th:src="@{/js/bootstrap.bundle.min.js}" defer></script>
</head>

<body>
<div id="auth">

    <div class="row h-100">

        <!-- LEFT: Login Form -->
        <div class="col-lg-6 col-12 d-flex align-items-center">
            <div class="auth-form w-100 px-4 px-lg-5">

                <!-- Logo -->
                <div class="text-center mb-4">
                    <img src="/images/logo-4.png" alt="FreelanchingBD"
                         style="height:120px;">
                </div>

                <!-- Title -->
                <h2 class="fw-bold text-center mb-2">Welcome Back 👋</h2>
                <p class="text-center text-muted mb-4">
                    Sign in to manage your freelancing journey
                </p>

                <!-- Error message (Spring Security) -->
                <div th:if="${param.error}" class="alert alert-danger">
                    Invalid username or password
                </div>

                <div th:if="${param.logout}" class="alert alert-success">
                    You have been logged out successfully
                </div>

                <!-- Login Form -->
                <form th:action="@{/login}" method="post">

                    <div class="form-group position-relative has-icon-left mb-4">
                        <input type="text"
                               class="form-control form-control-xl"
                               placeholder="Username"
                               name="username"
                               required>
                        <div class="form-control-icon">
                            <i class="bi bi-person"></i>
                        </div>
                    </div>

                    <div class="form-group position-relative has-icon-left mb-4">
                        <input type="password"
                               name="password"
                               class="form-control form-control-xl"
                               placeholder="Password"
                               required>
                        <div class="form-control-icon">
                            <i class="bi bi-shield-lock"></i>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input class="form-check-input"
                                   type="checkbox"
                                   id="rememberMe">
                            <label class="form-check-label text-muted" for="rememberMe">
                                Remember me
                            </label>
                        </div>

                        <a href="/forgot-password" class="text-primary fw-bold">
                            Forgot Password?
                        </a>
                    </div>

                    <button type="submit"
                            class="btn btn-primary btn-block btn-lg shadow-sm">
                        Log In
                    </button>
                </form>

                <!-- Register -->
                <div class="text-center mt-4">
                    <p class="text-muted">
                        Don’t have an account?
                        <a th:href="@{/register}" class="fw-bold text-primary">
                            Create one
                        </a>
                    </p>
                </div>

            </div>
        </div>

        <!-- RIGHT: Illustration -->
        <div class="col-lg-6 d-none d-lg-flex align-items-center justify-content-center bg-light">
            <div class="text-center">
                <img src="/images/happy_mom_working.png"
                     alt="Freelancing"
                     class="img-fluid"
                     style="max-height:520px;">
                <h4 class="mt-4 fw-bold text-dark">
                    One Platform. Endless Opportunities.
                </h4>
                <p class="text-muted px-5">
                    Hire talent or work as a freelancer — all in one place.
                </p>
            </div>
        </div>

    </div>
</div>
</body>
</html>
