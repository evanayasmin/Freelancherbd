<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <div th:replace="~{fragments/header :: header}"></div>
    <script th:src="@{/assets/vendors/tinymce/tinymce.min.js}"></script>
    <script th:src="@{/assets/vendors/tinymce/plugins/code/plugin.min.js}"></script>
    <script>
        tinymce.init({ selector: '#default' });
        tinymce.init({ selector: '#required_skill' });
        tinymce.init({ selector: '#dark', toolbar: 'undo redo styleselect bold italic alignleft aligncenter alignright bullist numlist outdent indent code', plugins: 'code' });
    </script>
    <link rel="stylesheet" th:href="@{/assets/vendors/simple-datatables/style.css}">
</head>
<body>
<div id="app">
    <div id="sidebar" class="active">
        <div class="sidebar-wrapper active">
            <div class="sidebar-header">
                <div class="d-flex justify-content-between">
                    <div class="logo">
                        <a href="index.html"><img src="assets/images/logo/logo.png" alt="Logo" srcset=""></a>
                    </div>
                    <div class="toggler">
                        <a href="#" class="sidebar-hide d-xl-none d-block"><i class="bi bi-x bi-middle"></i></a>
                    </div>
                </div>
            </div>
            <div th:replace="~{fragments/navigation :: navigation}"></div>
            <button class="sidebar-toggler btn x"><i data-feather="x"></i></button>
        </div>
    </div>
    <div id="main" class='layout-navbar'>
        <div th:replace="~{fragments/profile_header :: profile-header}"></div>
        <div id="main-content">
            <div class="page-heading">
                <div class="page-title">
                    <div class="row">
                        <div class="col-12 col-md-6 order-md-1 order-last"></div>
                        <div class="col-12 col-md-6 order-md-2 order-first">
                            <nav aria-label="breadcrumb" class="breadcrumb-header float-start float-lg-end">
                                <ol class="breadcrumb">
                                    <li class="breadcrumb-item"><a th:href="@{/home}">Dashboard</a></li>
                                    <li class="breadcrumb-item active" aria-current="page">Find Work /Applied Jobs</li>
                                </ol>
                            </nav>
                        </div>
                    </div>
                </div>
                <section class="section">
                    <div class="card">
<!--                        <div class="card-header">Your Applied Job List</div>-->
                        <div class="card-body" id="freelancerCardBody">
                            <table class="table table-striped" id="table1">
                                <thead>
                                <tr><th colspan="6">Applied Job List</th></tr>
                                </thead>
                                <tbody>
                                <tr th:each="job : ${jobs}">
                                    <td colspan="6">
                                        <div class="card bg-light-secondary mb-3">
                                            <div class="card-content">
                                                <div class="card-header bg-info" style="padding-top:1px;"></div>
                                                <div class="card-body">
                                                    <!-- Main Job Title -->
                                                    <h4 class="card-title mb-3">
                                                        <span th:text="${job.title}"></span>
                                                    </h4>

                                                    <!-- Category and Job Type -->
                                                    <div class="row mb-2">
                                                        <div class="col-md-6">
                                                            <strong>Category:</strong>
                                                            <span th:text="${job.getCategory().getCategoryName()}"></span>
                                                        </div>
                                                        <div class="col-md-3">
                                                            <strong>Job Type:</strong>
                                                            <span th:text="${job.jobType}"></span>
                                                        </div>
                                                        <div class="col-md-3">
                                                            <strong>Location:</strong>
                                                            <span th:text="${job.jobLocation}"></span>
                                                        </div>
                                                    </div>

                                                    <!-- Required Skills -->
                                                    <div class="mb-3">
                                                        <strong>Required Skills:</strong>
                                                        <p class="card-text mb-1">
                                                            <span th:text="${#strings.abbreviate(job.requiredSkill, 100)}"></span>
                                                        </p>
                                                    </div>

                                                    <hr/>

                                                    <!-- Price, Deadline, and Vacancy -->
                                                    <div class="row mb-3">
                                                        <div class="col-md-4">
                                                            <strong>Price:</strong>
                                                            <span th:text="${job.paymentAmount}"></span>
                                                        </div>
                                                        <div class="col-md-4">
                                                            <strong>Deadline:</strong>
                                                            <span th:text="${#temporals.format(job.deadline, 'yyyy-MM-dd')}"></span>
                                                        </div>
                                                        <div class="col-md-4">
                                                            <strong>Vacancy:</strong>
                                                            <span th:text="${job.vacancy != null ? job.vacancy : 'N/A'}"></span>
                                                        </div>
                                                    </div>

                                                    <!-- Status and Posted Date -->
                                                    <div class="row align-items-center">
                                                        <div class="col-md-6">
                                                            <span class="badge bg-primary">Posted</span>
                                                            <small class="text-muted ms-2">
                                                                <span th:text="${#temporals.format(job.createdAt, 'yyyy-MM-dd')}"></span>
                                                            </small>
                                                        </div>
                                                        <div class="col-md-6 text-end">
                                                            <!-- View Details Button -->
                                                            <a type="button" th:target="_blank"
                                                               class="btn btn-sm btn-outline-primary"
                                                               th:href="@{('/jobs/job_detail/' + ${@aesUtil.encryptId(job.id)})}">
                                                                <i class="bi bi-book me-1"></i>View Details
                                                            </a>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </section>
                <div class="modal fade" id="jobViewModal" tabindex="-1" aria-hidden="true">
                    <div class="modal-dialog modal-lg">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title">Job Details</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body rounded bg-white" id="viewModalContent">
                                <!-- Form content will be loaded here -->

                            </div>
                        </div>
                    </div>
                </div>
                <!-- Delete Confirmation Modal -->
                <div class="modal fade" id="statusModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
                    <div class="modal-dialog">

                    </div>
                </div>
            </div>
            <footer>
                <div class="footer clearfix mb-0 text-muted">
                    <div th:replace="~{fragments/footer :: footer}"></div>
                    <script th:src="@{/assets/vendors/simple-datatables/simple-datatables.js}"></script>
                    <script>
                        // Simple Datatable
                        let table1 = document.querySelector('#table1');
                        let dataTable = new simpleDatatables.DataTable(table1);

                    </script>

                </div>
            </footer>
        </div>
        <!-- Toast Container (GLOBAL) -->
        <div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3"></div>
    </div>
</div>
</body>
</html>
