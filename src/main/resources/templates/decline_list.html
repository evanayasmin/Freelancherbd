<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <div th:replace="~{fragments/header :: header}"></div>
    <script th:src="@{/assets/vendors/tinymce/tinymce.min.js}"></script>
    <script th:src="@{/assets/vendors/tinymce/plugins/code/plugin.min.js}"></script>
    <script>
        tinymce.init({ selector: '#default' });
        tinymce.init({ selector: '#required_skill' });
        tinymce.init({ selector: '#dark', toolbar: 'undo redo styleselect bold italic alignleft aligncenter alignright bullist numlist outdent indent code', plugins: 'code' });
    </script>
    <link rel="stylesheet" th:href="@{/assets/vendors/simple-datatables/style.css}">
</head>
<body>
<div id="app">
    <div id="sidebar" class="active">
        <div class="sidebar-wrapper active">
            <div class="sidebar-header">
                <div class="d-flex justify-content-between">
                    <div class="logo">
                        <a href="index.html"><img src="assets/images/logo/logo.png" alt="Logo" srcset=""></a>
                    </div>
                    <div class="toggler">
                        <a href="#" class="sidebar-hide d-xl-none d-block"><i class="bi bi-x bi-middle"></i></a>
                    </div>
                </div>
            </div>
            <div th:replace="~{fragments/navigation :: navigation}"></div>
            <button class="sidebar-toggler btn x"><i data-feather="x"></i></button>
        </div>
    </div>
    <div id="main" class='layout-navbar'>
        <div th:replace="~{fragments/profile_header :: profile-header}"></div>
        <div id="main-content">
            <div class="page-heading">
                <div class="page-title">
                    <div class="row">
                        <div class="col-12 col-md-6 order-md-1 order-last"></div>
                        <div class="col-12 col-md-6 order-md-2 order-first">
                            <nav aria-label="breadcrumb" class="breadcrumb-header float-start float-lg-end">
                                <ol class="breadcrumb">
                                    <li class="breadcrumb-item"><a th:href="@{/home}">Dashboard</a></li>
                                    <li class="breadcrumb-item active" aria-current="page">Proposals / Decline proposal</li>
                                </ol>
                            </nav>
                        </div>
                    </div>
                </div>
                <div class="page-heading mb-4">
                    <div class="d-flex justify-content-between align-items-center flex-wrap">
                        <div>
                            <h3 class="fw-bold mb-1 text-danger">
                                <i class="bi bi-x-circle-fill me-2"></i>
                                Declined Proposals
                            </h3>
                            <p class="text-muted mb-0">
                                Proposals that were reviewed and declined
                            </p>
                        </div>
                        <span class="badge bg-danger-subtle text-danger fs-6">
                            Total Declined: <span th:text="${#lists.size(proposals)}"></span>
                        </span>
                    </div>
                </div>

                <section class="section">
                    <div class="card border-0 shadow-sm">
                        <div class="card-header bg-white border-bottom">
                            <h5 class="fw-semibold mb-0">
                                <i class="bi bi-archive-fill me-2 text-secondary"></i>
                                Declined Proposal Archive
                            </h5>
                        </div>

                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-hover align-middle" id="table1">
                                    <thead class="table-light">
                                    <tr>
                                        <th>Job</th>
                                        <th>Category</th>
                                        <th>Applicant</th>
                                        <th>Expected Salary</th>
                                        <th>Status</th>
                                        <th>Applied On</th>
                                        <th class="text-center">Action</th>
                                    </tr>
                                    </thead>

                                    <tbody>
                                    <tr th:each="jobp : ${proposals}" class="text-muted">

                                        <!-- Job -->
                                        <td>
                                            <div class="fw-semibold text-dark" th:text="${jobp.job.title}"></div>
                                        </td>

                                        <!-- Category -->
                                        <td>
                            <span class="badge bg-light-secondary"
                                  th:text="${jobp.job.category.categoryName}">
                            </span>
                                        </td>

                                        <!-- Applicant -->
                                        <td>
                                            <div class="d-flex align-items-center gap-2">
                                                <div class="avatar bg-secondary text-white rounded-circle">
                                                    <span th:text="${#strings.substring(jobp.user.fullname,0,1)}"></span>
                                                </div>
                                                <span th:text="${jobp.user.fullname}"></span>
                                            </div>
                                        </td>

                                        <!-- Salary -->
                                        <td>
                                            ৳ <span th:text="${jobp.expectedSalary}"></span>
                                        </td>

                                        <!-- Status -->
                                        <td>
                            <span class="badge bg-danger-subtle text-danger">
                                Declined
                            </span>
                                        </td>

                                        <!-- Date -->
                                        <td>
                                            <i class="bi bi-calendar-x me-1"></i>
                                            <span th:text="${#temporals.format(jobp.applicationDate,'dd MMM yyyy')}"></span>
                                        </td>

                                        <!-- Action -->
                                        <td class="text-center">
                                            <button type="button"
                                                    class="btn btn-sm btn-outline-secondary"
                                                    data-bs-toggle="modal"
                                                    data-bs-target="#proposalViewModal"
                                                    th:data-url="@{/employer/jobs/proposal_details(encId=${@aesUtil.encryptId(jobp.id)})}">
                                                <i class="bi bi-eye"></i>
                                                View
                                            </button>
                                        </td>

                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </section>

                <div class="modal fade" id="proposalViewModal" tabindex="-1" aria-hidden="true">
                    <div class="modal-dialog modal-dialog-scrollable modal-xl">
                        <div class="modal-content">
                            <div class="modal-header bg-secondary text-white">
                                <h5 class="modal-title">
                                    <i class="bi bi-file-earmark-text me-2"></i>
                                    Declined Proposal Details
                                </h5>
                                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body rounded bg-white" id="viewModalContent">
                                <!-- Form content will be loaded here -->
                            </div>

                        </div>
                    </div>
                </div>

            </div>
            <footer>
                <div class="footer clearfix mb-0 text-muted">
                    <div th:replace="~{fragments/footer :: footer}"></div>
                    <script th:src="@{/assets/vendors/simple-datatables/simple-datatables.js}"></script>
                    <script>
                        // Simple Datatable
                        let table1 = document.querySelector('#table1');
                        let dataTable = new simpleDatatables.DataTable(table1);

                    </script>

                </div>
            </footer>
        </div>
        <!-- Toast Container (GLOBAL) -->
        <div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3"></div>
    </div>
</div>
</body>
</html>
