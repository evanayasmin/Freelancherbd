<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <div th:replace="~{fragments/header :: header}"></div>
</head>
<body>
<div id="app">
    <div id="sidebar" class="active">
        <div class="sidebar-wrapper active">
            <div class="sidebar-header">
                <div class="d-flex justify-content-between">
                    <div class="logo">
                        <a href="index.html"><img src="assets/images/logo/logo.png" alt="Logo" srcset=""></a>
                    </div>
                    <div class="toggler">
                        <a href="#" class="sidebar-hide d-xl-none d-block"><i class="bi bi-x bi-middle"></i></a>
                    </div>
                </div>
            </div>
            <div th:replace="~{fragments/navigation :: navigation}"></div>
            <button class="sidebar-toggler btn x"><i data-feather="x"></i></button>
        </div>
    </div>
    <div id="main" class='layout-navbar'>
        <div th:replace="~{fragments/profile_header :: profile-header}"></div>
        <div id="main-content">
            <div class="page-heading">
                <div class="page-title">
                    <div class="row">
                        <div class="col-12 col-md-6 order-md-1 order-last"></div>
                        <div class="col-12 col-md-6 order-md-2 order-first">
                            <nav aria-label="breadcrumb" class="breadcrumb-header float-start float-lg-end">
                                <ol class="breadcrumb">
                                    <li class="breadcrumb-item"><a th:href="@{/home}">Dashboard</a></li>
                                    <li class="breadcrumb-item active" aria-current="page">Find Freelancers / Saved Freelancers </li>
                                </ol>
                            </nav>
                        </div>
                    </div>
                </div>
                <section id="basic-vertical-layouts" class="section">
                    <div class="container mt-4">
                        <h5 class="mb-4 fw-bold text-secondary"><hr/></h5>
                        <div class="row row-cols-1 row-cols-md-3 g-4">
                            <div class="col" th:each="freelancer : ${freelancers}">
                                <div class="card h-80 shadow-sm border-0 rounded-4">
                                    <div class="card-body text-center">
                                        <img th:if="${freelancer.user.userProfile.profilePicture != null}"
                                             th:src="@{${freelancer.user.userProfile.profilePicture}}"
                                             alt="Profile Picture" class="rounded-circle" width="100" height="100">

                                        <img th:if="${freelancer.user.userProfile.profilePicture == null}"
                                             th:src="@{/images/default.jpg}"
                                             alt="Default Profile" class="rounded-circle" width="100" height="100">

                                        <h5 class="card-title mb-1" th:text="${freelancer.user.fullname}">John Doe</h5>
                                        <p class="text-muted mb-2" th:text="${freelancer.user.userProfile.title}">Full Stack Developer</p>
                                        <div class="mb-2">
                            <span class="badge bg-light text-dark me-1"
                                  th:each="skill : ${#strings.arraySplit(freelancer.user.userProfile.skills, ',')}"
                                  th:text="${skill}">ReactJS</span></div>
                                   <div class="mb-3">
                                    <span class="text-warning">
                                        <i class="bi bi-star-fill"></i>
                                        <i class="bi bi-star-fill"></i>
                                        <i class="bi bi-star-fill"></i>
                                        <i class="bi bi-star-half"></i>
                                        <i class="bi bi-star"></i>
                                    </span>
                                            <small class="text-muted" th:text="'(' + ${freelancer.user.userProfile.ratings} + ')'">4.7</small>
                                        </div>
                                        <p class="text-muted small"
                                           th:text="${#strings.abbreviate(freelancer.user.userProfile.getProfessionalSummary(), 80)}">
                                        </p>
                                        <p>
                                        <a th:href="@{('/employer/freelancer/profile_detail/' + ${@aesUtil.encryptId(freelancer.user.id)})}"
                                           class="btn btn-sm text-white"
                                           style="background-color: #0b5ed7; color: #333;">View Profile</a>
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
                <!-- Toast Container (GLOBAL) -->
                <div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3"></div>
            </div>
            <footer>
                <div class="footer clearfix mb-0 text-muted">
                    <div th:replace="~{fragments/footer :: footer}"></div>
                </div>
            </footer>
        </div>
    </div>
</div>
</body>
</html>
