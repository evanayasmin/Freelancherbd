<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><div th:replace="~{fragments/header :: header}"></div>
    <link rel="stylesheet" th:href="@{/assets/vendors/simple-datatables/style.css}">

</head>
<body>
<div id="app">
    <div id="sidebar" class="active">
        <div class="sidebar-wrapper active">
            <div class="sidebar-header">
                <div class="d-flex justify-content-between">
                    <div class="logo">
                        <a href="index.html"><img src="assets/images/logo/logo.png" alt="Logo" srcset=""></a>
                    </div>
                    <div class="toggler">
                        <a href="#" class="sidebar-hide d-xl-none d-block"><i class="bi bi-x bi-middle"></i></a>
                    </div>
                </div>
            </div>
            <div th:replace="~{fragments/navigation :: navigation}"></div>
            <button class="sidebar-toggler btn x"><i data-feather="x"></i></button>
        </div>
    </div>
    <div id="main" class='layout-navbar'>
        <div th:replace="~{fragments/profile_header :: profile-header}"></div>
        <div id="main-content">
            <div class="page-heading">
                <div class="page-title">
                    <div class="row">
                        <div class="col-12 col-md-6 order-md-1 order-last">
                            <!--  <h3>Vertical Layout with Navbar</h3>-->
                        </div>
                        <div class="col-12 col-md-6 order-md-2 order-first">
                            <nav aria-label="breadcrumb" class="breadcrumb-header float-start float-lg-end">
                                <ol class="breadcrumb">
                                    <li class="breadcrumb-item"><a th:href="@{/home}">Dashboard</a></li>
                                    <li class="breadcrumb-item active" aria-current="page">Find Freelancer / Browse By Skill</li>
                                </ol>
                            </nav>
                        </div>
                    </div>
                </div>
                <section id="basic-vertical-layouts">
                    <div class="row match-height">
                        <div class="col-md-12 col-12">
                            <div class="card shadow-sm text-info border-0 rounded-4">
                                <div class="card-header"><h4 class="card-title">Search Freelancer</h4></div>
                                <div class="card-content">
                                    <div class="card-body">
                                            <div class="form-body">
                                                <div class="row">
                                                    <div class="col-6">
                                                        <div class="form-group">
                                                            <label for="skill_title">Skill Keyword: </label>
                                                            <input type="text" id="skill_title" class="form-control" required placeholder="Keyword: PHP, MYSQL" />
                                                        </div>
                                                    </div>
                                                    <div class="col-6">
                                                        <div class="form-group">
                                                            <label for="title"> Job title: </label>
                                                            <input type="text" id="title" class="form-control" placeholder="Web Developer, Apps Developer" />
                                                        </div>
                                                    </div>
<!--                                                    <div class="col-6">-->
<!--                                                        <div class="form-group">-->
<!--                                                            <label class="form-label">Job Category</label>-->
<!--                                                            <select class="form-select" th:name="category" id="category">-->
<!--                                                                <option th:each="st : ${categories}"-->
<!--                                                                        th:value="${st.categoryName}"-->
<!--                                                                        th:text="${st.categoryName}">-->
<!--                                                                </option>-->
<!--                                                            </select>-->
<!--                                                        </div>-->
<!--                                                    </div>-->
                                                    <div class="col-6">
                                                        <div class="form-group">
                                                        <label class="form-label">Job Type</label>
                                                        <select th:name="jobType" class="form-select" id="jobType">
                                                            <option th:each="jt : ${jobTypes}"
                                                                    th:value="${jt.name()}"
                                                                    th:text="${jt.name()}">
                                                            </option>
                                                        </select>
                                                        </div>
                                                    </div>
                                                    <div class="col-6">
                                                        <div class="form-group">
                                                            <label for="required_level">Required Level</label>
                                                            <select class="form-control" id="required_level">
                                                                <option value="S.S.C">S.S.C</option>
                                                                <option value="H.S.C">H.S.C</option>
                                                                <option value="BA(Degree)">BA(Degree)</option>
                                                                <option value="MA(Degree)">MA(Degree)</option>
                                                                <option value="BSc(Hons)" selected>BSc(Hons)</option>
                                                                <option value="MSc">MSc</option>
                                                                <option value="PHD">PHD</option>
                                                                <option value="PGD">PGD</option>
                                                            </select>
                                                        </div>
                                                    </div>
                                                    <div class="col-12 d-flex justify-content-end">
                                                        <button type="button" class="btn btn-primary me-1 mb-1" id="searchFreelancerBtn"><i class="bi bi-search"></i> Search</button>
                                                        <button type="reset" class="btn btn-light-secondary me-1 mb-1"><i class="bi bi-eraser"></i> Clear</button>
                                                    </div>
                                                </div>
                                            </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="row col-md-12">
                            <div class="card shadow-sm border-0 rounded-4">
                                <div class="card-body">
                                    <table id="table1" class="table table-bordered">
                                        <thead>
                                        <tr>
                                            <th>Name</th>
                                            <th>Title</th>
                                            <th>Skills</th>
                                            <th>Experience</th>
                                            <th>Availability</th>
                                            <th>Action</th>
                                        </tr>
                                        </thead>
                                        <tbody>
                                        <!-- Will be replaced by AJAX -->

                                        </tbody>
                                    </table>
                                </div>
                            </div>
                            </div>
                    </div>
                </section>
            </div>
            <footer>
                <div class="footer clearfix mb-0 text-muted">
                    <div th:replace="~{fragments/footer :: footer}"></div>
                    <script th:src="@{/assets/vendors/simple-datatables/simple-datatables.js}"></script>
                    <link rel="stylesheet" th:href="@{/assets/vendors/simple-datatables/style.css}">

                    <script>
                        // Simple Datatable
                        let table1 = document.querySelector('#table1');
                        let dataTable = new simpleDatatables.DataTable(table1);

                        function reloadTable(rowHtml) {
                            dataTable.destroy(); // remove old datatable

                            // replace tbody only
                            table1.querySelector('tbody').innerHTML = rowHtml;

                            // reinitialize
                            dataTable = new simpleDatatables.DataTable(table1);
                        }
                    </script>

                </div>
            </footer>
        </div>
    </div>
    <div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

</div>
</body>
</html>
