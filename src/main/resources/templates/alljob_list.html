<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <div th:replace="~{fragments/header :: header}"></div>
    <script th:src="@{/assets/vendors/tinymce/tinymce.min.js}"></script>
    <script th:src="@{/assets/vendors/tinymce/plugins/code/plugin.min.js}"></script>
    <script>
        tinymce.init({ selector: '#default' });
        tinymce.init({ selector: '#required_skill' });
        tinymce.init({ selector: '#dark', toolbar: 'undo redo styleselect bold italic alignleft aligncenter alignright bullist numlist outdent indent code', plugins: 'code' });
    </script>
    <link rel="stylesheet" th:href="@{/assets/vendors/simple-datatables/style.css}">
</head>
<body>
<div id="app">
    <div id="sidebar" class="active">
        <div class="sidebar-wrapper active">
            <div class="sidebar-header">
                <div class="d-flex justify-content-between">
                    <div class="logo">
                        <a href="index.html"><img src="assets/images/logo/logo.png" alt="Logo" srcset=""></a>
                    </div>
                    <div class="toggler">
                        <a href="#" class="sidebar-hide d-xl-none d-block"><i class="bi bi-x bi-middle"></i></a>
                    </div>
                </div>
            </div>
            <div th:replace="~{fragments/navigation :: navigation}"></div>
            <button class="sidebar-toggler btn x"><i data-feather="x"></i></button>
        </div>
    </div>
    <div id="main" class='layout-navbar'>
        <div th:replace="~{fragments/profile_header :: profile-header}"></div>
        <div id="main-content">
            <div class="page-heading">
                <div class="page-title">
                    <div class="row">
                        <div class="col-12 col-md-6 order-md-1 order-last"></div>
                        <div class="col-12 col-md-6 order-md-2 order-first">
                            <nav aria-label="breadcrumb" class="breadcrumb-header float-start float-lg-end">
                                <ol class="breadcrumb">
                                    <li class="breadcrumb-item"><a th:href="@{/home}">Dashboard</a></li>
                                    <li class="breadcrumb-item active" aria-current="page">Post Job / Job List</li>
                                </ol>
                            </nav>
                        </div>
                    </div>
                </div>
                <div class="page-heading mb-4">
                    <div class="d-flex justify-content-between align-items-center flex-wrap">
                        <div>
                            <h3 class="fw-bold mb-1">
                                <i class="bi bi-briefcase-fill me-2 text-primary"></i>
                                Your Job Posts
                            </h3>
                            <p class="text-muted mb-0">
                                Manage and track all your posted jobs
                            </p>
                        </div>

                        <span class="badge bg-primary-subtle text-primary fs-6">
                            Total Jobs: <span th:text="${#lists.size(jobs)}"></span>
                        </span>
                    </div>
                </div>
                <!-- Statistics Panel -->
                <div class="row g-3 mb-4">
                    <div class="col-xl-3 col-md-6">
                        <div class="card shadow-sm border-0">
                            <div class="card-body">
                                <h6 class="text-muted mb-1">Total Jobs</h6>
                                <h3 class="fw-bold text-primary" th:text="${totalJobs}"></h3>
                            </div>
                        </div>
                    </div>

                    <div class="col-xl-3 col-md-6">
                        <div class="card shadow-sm border-0">
                            <div class="card-body">
                                <h6 class="text-muted mb-1">Posted</h6>
                                <h3 class="fw-bold text-info" th:text="${postedJobs}"></h3>
                            </div>
                        </div>
                    </div>

                    <div class="col-xl-3 col-md-6">
                        <div class="card shadow-sm border-0">
                            <div class="card-body">
                                <h6 class="text-muted mb-1">In Progress</h6>
                                <h3 class="fw-bold text-warning" th:text="${inProgressJobs}"></h3>
                            </div>
                        </div>
                    </div>

                    <div class="col-xl-3 col-md-6">
                        <div class="card shadow-sm border-0">
                            <div class="card-body">
                                <h6 class="text-muted mb-1">Completed</h6>
                                <h3 class="fw-bold text-success" th:text="${completedJobs}"></h3>
                            </div>
                        </div>
                    </div>
                </div>


                <section class="section">
                     Search & Filter
                    <div class="card mb-4 border-0 shadow-sm">
                        <div class="card-body">
                            <div class="row g-3">
                                <div class="col-md-5">
                                    <input type="text" id="alljobSearch" class="form-control" placeholder="🔍 Search by job title">
                                </div>

                                <div class="col-md-4">
                                    <select id="statusFilter" class="form-select">
                                        <option value="">All Status</option>
                                        <option value="POSTED">Posted</option>
                                        <option value="PENDING">Pending</option>
                                        <option value="IN_PROGRESS">In Progress</option>
                                        <option value="COMPLETED">Completed</option>
                                        <option value="CANCELLED">Cancelled</option>
                                    </select>
                                </div>

                                <div class="col-md-3">
                                    <button class="btn btn-outline-secondary w-100"
                                            onclick="resetFilters()">
                                        Reset
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="card job-card h-100 border-0"
                         data-title="[[${job.title}]]"
                         data-status="[[${job.jobStatus.name()}]]"
                         data-category="[[${job.category.categoryName}]]">
                        <div class="card-header d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-2">
                            <div class="d-flex align-items-center gap-2">
                                <i class="bi bi-list-check"></i>
                                <div class="fw-bold">All Job List</div>
                            </div>
                        </div>
                        <div class="card-body" id="freelancerCardBody">
                        <div class="row g-4">
                        <div class="col-xl-4 col-lg-6 col-md-6 job-item"
                             th:each="job : ${jobs}">

                            <div class="card job-card h-100 border-0">

                                <!-- Card Header -->
                                <div class="card-header bg-white border-bottom d-flex justify-content-between align-items-start">
                                    <div>
                                        <h6 class="fw-semibold mb-1" th:text="${job.title}"></h6>
                                        <span class="badge bg-light-secondary"
                                              th:text="${job.category.categoryName}">
                                </span>
                                    </div>

                                    <!-- Status -->
                                    <div>
                                    <span th:if="${job.jobStatus.name() == 'POSTED'}"
                                        class="badge bg-primary text-white">Posted</span>

                                        <span th:if="${job.jobStatus.name() == 'PENDING'}"
                                              class="badge bg-warning text-white">Pending</span>

                                        <span th:if="${job.jobStatus.name() == 'IN_PROGRESS'}"
                                              class="badge bg-info text-white">In Progress</span>

                                        <span th:if="${job.jobStatus.name() == 'COMPLETED'}"
                                              class="badge bg-success text-white">Completed</span>

                                        <span th:if="${job.jobStatus.name() == 'CANCELLED'}"
                                              class="badge bg-danger text-white">Cancelled</span>
                                    </div>
                                </div>

                                <!-- Card Body -->
                                <div class="card-body">
                                    <div class="d-flex justify-content-between mb-2">
                                    <span class="text-muted">
                                        <i class="bi bi-cash-stack me-1"></i>
                                        Budget:
                                    </span>
                                        <span class="fw-bold text-success">
                                            ৳ <span th:text="${job.paymentAmount}"></span>
                                        </span>
                                    </div>

                                    <div class="d-flex justify-content-between mb-2">
                                    <span class="text-muted">
                                        <i class="bi bi-calendar-event me-1"></i>
                                        Deadline:
                                    </span>
                                        <span th:text="${#temporals.format(job.deadline,'dd MMM yyyy')}"></span>
                                    </div>

                                    <div class="d-flex justify-content-between">
                                        <span class="text-muted">
                                            <i class="bi bi-clock-history me-1"></i>
                                            Created:
                                        </span>
                                        <span th:text="${#temporals.format(job.createdAt,'dd MMM yyyy')}"></span>
                                    </div>
                                    <div class="d-flex align-items-start justify-content-between mt-2">
                                            <span class="text-muted fw-semibold">
                                                <i class="bi bi-book me-1"></i> Type:
                                            </span>
                                        <div class="d-flex flex-wrap gap-1 justify-content-end">
                                            <span class="badge rounded-pill bg-light-info text-primary">
                                                <i class="bi bi-lightning-charge me-1"></i>
                                                <span th:text="${job.jobType}"></span>
                                            </span>
                                        </div>
                                    </div>
<!--                                    <div class="d-flex align-items-start justify-content-between mt-2">-->
<!--                                    <span class="text-muted fw-semibold">-->
<!--                                        <i class="bi bi-tools me-1"></i> Skills:-->
<!--                                    </span>-->

<!--                                        <div class="d-flex flex-wrap gap-1 justify-content-end">-->
<!--                                        <span th:each="skill : ${#strings.arraySplit(job.requiredSkill, ',')}"-->
<!--                                              class="badge rounded-pill bg-light-info text-info">-->
<!--                                            <i class="bi bi-lightning-charge me-1"></i>-->
<!--                                            <span th:utext="${skill.trim()}"></span>-->
<!--                                        </span>-->
<!--                                        </div>-->
<!--                                    </div>-->

                                </div>

                                <!-- Card Footer -->
                                <div class="card-footer bg-white border-top d-flex justify-content-between align-items-center">
                                    <small class="text-muted"><span th:text="${job.jobLocation}"></span></small>
                                    <button type="button"
                                            class="btn btn-sm btn-outline-primary"
                                            data-bs-toggle="modal"
                                            data-bs-target="#jobViewModal"
                                            th:data-url="@{/employer/jobs/job_detail(encId=${@aesUtil.encryptId(job.id)})}">
                                        <i class="bi bi-eye"></i>
                                        View
                                    </button>
                                </div>

                            </div>
                        </div>

                    </div>
                    </div>
                     </div>
                </section>

                <div class="modal fade" id="jobViewModal" tabindex="-1" aria-hidden="true">
                    <div class="modal-dialog modal-lg">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title">Job Details</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body rounded bg-white" id="viewModalContent">
                                <!-- Form content will be loaded here -->

                            </div>
                        </div>
                    </div>
                </div>
                <!-- Delete Confirmation Modal -->
                <div class="modal fade" id="statusModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
                    <div class="modal-dialog">

                    </div>
                </div>
            </div>
            <footer>
                <div class="footer clearfix mb-0 text-muted">
                    <div th:replace="~{fragments/footer :: footer}"></div>
                    <script>
                        document.addEventListener('DOMContentLoaded', function () {

                            const searchInput = document.getElementById('alljobSearch');
                            const statusFilter = document.getElementById('statusFilter');
                            const jobCards = document.querySelectorAll('#freelancerCardBody .job-card');

                            if (!searchInput || !statusFilter) return;

                            function filterJobs() {
                                const searchValue = searchInput.value.toLowerCase();
                                const statusValue = statusFilter.value;

                                jobCards.forEach(card => {
                                    const title = (card.dataset.title || '').toLowerCase();
                                    const status = card.dataset.status || '';

                                    const matchesSearch = title.includes(searchValue);
                                    const matchesStatus = !statusValue || status === statusValue;

                                    /*const jobItem = card.closest('.job-item');
                                    if (!jobItem) return;*/
                                    const jobItem = card.closest('.job-item');
                                    jobItem.style.display =
                                        matchesSearch && matchesStatus ? '' : 'none';
                                });
                            }

                            searchInput.addEventListener('keyup', filterJobs);
                            statusFilter.addEventListener('change', filterJobs);

                            window.resetFilters = function () {
                                searchInput.value = '';
                                statusFilter.value = '';
                                filterJobs();
                            };

                        });
                    </script>


                </div>
            </footer>
        </div>
        <!-- Toast Container (GLOBAL) -->
        <div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3"></div>
    </div>
</div>
</body>
</html>
